packages:
  darwin:
    brews:
      # Basics
      - "coreutils"
      - "git"
      - "mise"
      - "ruby-build"
      - "uv"

      - "atuin"
      - "bat"
      - "delta"
      - "eza"
      - "fd"
      - "fish"
      - "fzf"
      - "gh"
      - "graphviz"
      - "hl"
      - "neovim"
      - "ripgrep"
      - "shellcheck"
      - "shfmt"
      - "starship"
      - "tree-sitter-cli"
      - "try-rs"
      - "zellij"
      - "zoxide"
    casks:
      - "claude"
      - "claude-code@latest"
      # - "docker-desktop"
      - "ghostty"
      - "google-chrome"
      - "zed"

    # Skills installed via npx skills (global, to ~/.agents/skills/)
    # Each entry: source repo + specific skill names to install
    # Use ["*"] to install all skills from a source
    skills:
      - source: "https://github.com/mattpocock/skills"
        skills:
          - "grill-me"
      - source: "https://github.com/pgolm/claude-plugins"
        skills:
          - "azure-foundry"
          - "litellm-gateway"
          - "work-summarizer"
      - source: "https://github.com/vercel-labs/agent-browser"
        skills:
          - "agent-browser"
