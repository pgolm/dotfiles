packages:
  darwin:
    brews:
      # Basics
      - "coreutils"
      - "git"
      - "mise"
      - "ruby-build"
      - "uv"

      - "atuin"
      - "bat"
      - "eza"
      - "fd"
      - "fish"
      - "fzf"
      - "gh"
      - "graphviz"
      - "herdr"
      - "hl"
      - "neovim"
      - "ripgrep"
      - "shellcheck"
      - "shfmt"
      - "starship"
      - "tree-sitter-cli"
      - "try-rs"
      - "zellij"
      - "zoxide"
    casks:
      - "claude"
      - "claude-code@latest"
      # - "docker-desktop"
      - "ghostty"
      - "google-chrome"
      - "zed"

    # Skills installed via npx skills (global, to ~/.agents/skills/)
    # Each entry: source repo + specific skill names to install
    # Use ["*"] to install all skills from a source
    skills:
      - source: "herdrdev/herdr"
        skills:
          - "herdr"
      - source: "mattpocock/skills"
        skills:
          - "grilling"
      - source: "pgolm/skills"
        skills:
          - "clarify"
          - "open-pull-request"
          - "to-spec"
          - "wrap-up-work"
      - source: "vercel-labs/agent-browser"
        skills:
          - "agent-browser"
